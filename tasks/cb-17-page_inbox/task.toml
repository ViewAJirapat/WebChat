title = "Inbox page: conversation list"
type = "feat"
files = ["src/chatbook/features/page_inbox/ui.js", "docs/ui.md"]
scope = ["src/chatbook/features/page_inbox/**"]
prompt = """
Implement the page `inbox` in `src/chatbook/features/page_inbox/ui.js`. The file is a stub:
keep its CONTRACT comment and its `CB.page('inbox', ...)` call with `title: 'Chats'`,
`nav: 'Chats'`, `order: 10` and `poll: 3000`, and replace the stub body with `load` and
`render` below.
Reference: docs/ui.md (read-only).

CB.page('inbox', {title: 'Chats', nav: 'Chats', order: 10, poll: 3000, load, render})
load(): return await CB.api('GET', '/api/conversations')
render(d) -> CB.el('div', {class: 'stack'},
  CB.el('div', {class: 'row'}, CB.el('h2', {}, 'Chats'),
        CB.el('button', {onclick: () => CB.go('group_new')}, 'New group')),
  d.conversations.length ? d.conversations.map(item)
                         : CB.el('p', {class: 'muted'}, 'No conversations yet'))
item(c) = CB.el('div', {class: c.unread > 0 ? 'item unread' : 'item', testid: 'conv-' + c.id,
                        onclick: () => CB.go('chat', {id: c.id})},
  CB.el('b', {}, c.title),
  CB.el('div', {class: 'muted'}, c.last_message
      ? c.last_message.sender.display_name + ': ' + CB.short(c.last_message.body, 60)
      : 'No messages yet'),
  CB.el('small', {class: 'muted'}, CB.time(c.updated_at)),
  c.unread > 0 ? CB.el('span', {class: 'badge'}, String(c.unread)) : null)
Server answer: {conversations: [C]}, C = {id, kind, title, members, last_message: M | null,
unread, updated_at}, M = {id, conversation_id, sender: U, body, created_at}.

Details:
- The page polls every `3000` ms (`poll: 3000`).
- `load` fetches `GET /api/conversations` and returns the response object `{conversations: [C]}`.
- The top `<div class="row">` contains `<h2>Chats</h2>` and a `<button>` labeled `'New group'`
  whose `onclick` navigates to `'group_new'` (`CB.go('group_new')`).
- When `d.conversations` is empty, render `<p class="muted">No conversations yet</p>`.
- Otherwise, render one `<div testid="conv-<id>">` per conversation in `d.conversations` in order,
  with class `'item unread'` when `c.unread > 0` and `'item'` otherwise, and `onclick` calling
  `CB.go('chat', {id: c.id})`.
- Each conversation item contains, in order: `<b>{c.title}</b>`, the `<div class="muted">` preview
  (`sender.display_name + ': ' + CB.short(c.last_message.body, 60)` when `c.last_message` is
  present, or `'No messages yet'` when null), `<small class="muted">{CB.time(c.updated_at)}</small>`,
  and when `c.unread > 0`, `<span class="badge">{String(c.unread)}</span>`.
- Do not write `try`/`catch`: `CB.api` handles error answers itself.

Texts, headings, classes, testids, button labels and element order must match exactly; error
message texts are not tested.
"""
