  "docs/api/chat.md",
]
scope = ["src/chatbook/features/groups/**"]
prompt = """
Implement the feature `groups` in `src/chatbook/features/groups/handler.py`. The file is a
stub: keep its CONTRACT docstring, its two @route lines and the function names `create_group`
and `rename_group`, and replace each `raise HTTPError(501, ...)` with the implementation below.
Reference: docs/api/base.md, docs/api/social.md and docs/api/chat.md (read-only).
Notation: db = request.db, me = request.me.id.

POST /api/groups  body {"title", "member_ids"}            function create_group
Checks in exactly this order; the first failing check decides the status:
  1. title = body_str(request, "title", max_len=50)
     (missing, not a string, empty after strip or longer than 50 -> 400 itself; a body that
     is not a JSON object -> 400 itself; the title is stored stripped)
  2. ids = [i for i in body_ids(request, "member_ids") if i != me]
     (missing, not a list, more than 100 items, or an item that is not a positive integer:
     true, 0, "3" and 1.5 are not -> 400 itself; body_ids removes duplicates and keeps the
     first-seen order; then my own id is dropped)
  3. not ids -> 400                (nobody but me)
     len(ids) > 49 -> 400          (a group has at most 50 members, me included; count the
                                   ids after duplicates and my id are removed)
  4. for uid in ids, one at a time, in list order:
       require_user(db, uid)                    (unknown user -> 404 itself)
       not are_friends(db, me, uid) -> 403      (a pending friend request is not a friendship)
     So [stranger, unknown] -> 403 but [unknown, stranger] -> 404. Members must be my
     friends; they need not be friends of each other.
  5. cid = create_conversation(db, "group", title, me, ids, request.now)
     (members = me + ids; it writes the conversations and members rows)
  -> 201 {"conversation": conversation_json(db, cid, me)}
Every create makes a new conversation, even when a group with the same title and members
already exists. A 400, 403 or 404 creates nothing.

PUT /api/groups/{id}  body {"title"}                      function rename_group
Checks in exactly this order:
  1. cid = path_id(request)                     (a bad id raises 404 itself)
     conv = require_member(db, cid, me)         (no such conversation, or I am not a member:
                                                404 itself; a member who left is not one)
  2. conv["kind"] != "group" -> 400             (a direct conversation cannot be renamed)
  3. title = body_str(request, "title", max_len=50)     (same rules as above -> 400)
  4. db.run("UPDATE conversations SET title = ? WHERE id = ?", title, cid)
  -> 200 {"conversation": conversation_json(db, cid, me)}
Any member may rename, not only the creator. The answer is the conversation as I (the
renamer) see it, with my own "unread"; a rename changes neither "last_message" nor
"updated_at". A non-member gets 404 even when the title is bad or the conversation is
direct. Only the title of this one conversation changes.

conversation_json(db, cid, me) builds C = {"id", "kind", "title", "members", "last_message",
"unread", "updated_at"} (docs/api/chat.md); never build it by hand.

Imports, all from chatbook.core.api: HTTPError, Request, Response, route, are_friends,
body_ids, body_str, conversation_json, create_conversation, path_id, require_member,
require_user.

Example: users ana ("Ana Diaz", id 1), ben ("Ben Ng", id 2) and cleo ("Cleo Cruz", id 3);
ana is friends with ben and cleo; request.now is 1700000050000. As ana, POST
{"title": " Book club ", "member_ids": [3, 2, 1, 3]} -> 201 {"conversation": {"id": 1,
"kind": "group", "title": "Book club", "members": [{"id": 1, "username": "ana",
"display_name": "Ana Diaz"}, {"id": 2, "username": "ben", "display_name": "Ben Ng"},
{"id": 3, "username": "cleo", "display_name": "Cleo Cruz"}], "last_message": null,
"unread": 0, "updated_at": 1700000050000}}. As ana, POST {"title": "Solo", "member_ids": [1]}
-> 400. As ben, PUT /api/groups/1 {"title": "Readers"} -> 200, the same conversation with
"title": "Readers".

Tables you may write: conversations.title (the UPDATE above); conversations and members only
through create_conversation.
JSON keys, status codes, list order and quoted texts must match exactly; error message
texts are not tested.
"""
